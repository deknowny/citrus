name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: tag matches Cargo.toml
        run: test "v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
        env:
          CITRUS_BUILD_COMMIT: ${{ github.sha }}
      - name: package
        run: |
          name="citrus-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          cp target/release/citrus "dist/$name"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && cat *.sha256 > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/citrus-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md."
