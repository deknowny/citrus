name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The CLI tests keep their state in Postgres (CITRUS_TEST_STATE; each
      # throwaway repository its own schema), as citrus.ci's `test` check:
      # the same postgres:17 with room for the tests' many processes. Not a
      # `services:` container: those run on Linux runners only and take no
      # server flags (max_connections).
      - name: postgres (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name citrus-test-pg -e POSTGRES_PASSWORD=t -p 127.0.0.1:55432:5432 \
            postgres:17-alpine -c max_connections=1000
          if ! timeout 60 sh -c 'until docker exec citrus-test-pg pg_isready -U postgres -h 127.0.0.1 -q; do sleep 0.5; done'; then
            echo "postgres did not start within 60 s:"
            docker logs citrus-test-pg
            exit 1
          fi
          echo "CITRUS_TEST_STATE=postgres://postgres:t@127.0.0.1:55432/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - name: postgres (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --quiet postgresql@17
          PG="$(brew --prefix postgresql@17)/bin"
          rm -rf "$RUNNER_TEMP/pg"
          "$PG/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust >/dev/null
          if ! "$PG/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -t 60 \
            -o "-p 55432 -c max_connections=1000 -k $RUNNER_TEMP" -w start; then
            echo "postgres did not start:"
            cat "$RUNNER_TEMP/pg.log"
            exit 1
          fi
          echo "CITRUS_TEST_STATE=postgres://postgres@127.0.0.1:55432/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - name: test
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          cargo test --locked

  pool:
    # The pool against a real Postgres, and checks inside an image (Docker).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: citrus
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      CITRUS_TEST_POOL: postgres://postgres:citrus@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          cargo test --locked --test pool -- --test-threads 1
