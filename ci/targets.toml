# Citrus checks itself with Citrus: `citrus run` selects these by changed paths.

[targets.test]
description = "Unit and integration tests on throwaway Git repositories"
cache = true
inputs = ["src/**", "tests/**", "examples/**"]
extra_inputs = ["Cargo.toml", "Cargo.lock"]

[targets.lint]
description = "rustfmt and clippy with warnings as errors"
cache = true
inputs = ["src/**", "tests/**", "rustfmt.toml"]
extra_inputs = ["Cargo.toml", "Cargo.lock"]

[targets.docs]
description = "Relative links in Markdown point at existing files"
cache = true
inputs = ["*.md", "docs/**", "skills/**", "examples/**", "scripts/check-links.sh"]

[targets.doctor]
description = "This repository's own Citrus configuration is valid"
cache = true
inputs = ["citrus.toml", "ci/targets.toml", "Makefile", "scripts/release.sh"]
extra_inputs = ["src/**", "Cargo.toml", "Cargo.lock"]
