# ci/targets.toml — one entry per check.
# `inputs` are the files a check owns: changing one selects it.
# `extra_inputs` are files it only reads: they invalidate reuse but do not select it.
# `cache = true` reuses a PASS while all of them are unchanged — list everything it reads.

[targets.test-api]
description = "API unit tests"
cache = true
inputs = ["api/**"]
extra_inputs = ["Cargo.lock"]

[targets.lint-docs]
description = "Markdown links and spelling"
cache = true
inputs = ["docs/**", "*.md"]
