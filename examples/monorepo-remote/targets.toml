# Declared checks own their inputs; the project planner routes everything else.
# Keys Citrus does not use (here `resources`, `linux`) are kept for the planner.

[targets.test-network]
description = "Network inventory and listener admission"
cache = true
resources = ["contracts"]
inputs = ["scripts/network*.py", "config/network.toml"]
extra_inputs = ["config/**"]

[targets.test-web-e2e]
description = "Browser end-to-end tests"
resources = ["playwright"]
linux = true
inputs = ["web/e2e/**"]
