# A monorepo with its own planner and a remote runner on shared builders.
manifest = "ci/targets.toml"
toolchain_files = ["rust-toolchain.toml", ".python-version"]
log_dir = ".validation/citrus"

[plan]
# The project's planner keeps owning path → check routing. It prints
# `TARGET\tmake:<name>` lines (optionally PLAN/MAPPED/UNMAPPED).
command = ["make", "--no-print-directory", "ci-plan"]
base_arg = "BASE_REF={base}"

[run]
local = ["make", "--no-print-directory", "{target}"]
# Runs the whole planned set on a builder and reports each target as
#   LANE target=<name> status=START|PASS|FAIL exit=<n> seconds=<n>
remote = ["make", "--no-print-directory", "remote-check"]
progress_prefixes = ["LANE"]
waiting_prefix = "QUEUED resource="
acquired_prefixes = ["ACQUIRED resource="]
stage_prefix = "STAGE "
# The runner keeps detailed output in its own file and prints its path.
linked_log_markers = ["full log: "]

[run.env.test-backend]
DATABASE_URL = ""

[status]
# A slow command that describes shared builders; `status` shows its last
# snapshot instantly and refreshes it in the background.
resources_command = ["make", "--no-print-directory", "builders-status"]
resource_prefix = "BUILDER "
refresh_seconds = 60

[state]
backend = "sqlite"
